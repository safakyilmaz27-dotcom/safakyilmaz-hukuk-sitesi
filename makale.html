<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yönlendiriliyorsunuz | Av. Şafak Yılmaz Hukuk Bürosu</title>
  <!-- Eski /makale?id=... adresleri artık statik /makaleler/<slug> sayfalarına taşındı. -->
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#0b1d39" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/articles.css" />
  <script>
    (function () {
      var m = location.search.match(/[?&]id=([^&]+)/);
      var slug = m ? decodeURIComponent(m[1]) : '';
      location.replace(slug ? '/makaleler/' + slug : '/makaleler');
    })();
  </script>
</head>
<body data-page="article-redirect">
  <section style="padding:6rem 1rem; text-align:center;">
    <div class="container">
      <p class="empty-state">
        Bu makale yeni adresine taşındı.
        <a href="/makaleler" style="color:var(--gold); font-weight:600;">Makaleye git →</a>
      </p>
    </div>
  </section>
</body>
</html>
